[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aprendizado-maquina-ligia"
version = "1.0.0"
description = "Experimentos selecionados de detecção em domínios climáticos: CLIP RN101 e DINO ResNet-50"
requires-python = ">=3.10,<3.12"
dependencies = ["PyYAML==6.0.2", "Pillow==10.2.0"]

[project.optional-dependencies]
cluster = [
  "torch==2.1.2",
  "torchvision==0.16.2",
  "numpy==1.26.4",
  "mmengine==0.10.5",
  "mmdet==3.3.0",
  "open_clip_torch==2.24.0",
  "timm==1.0.29",
  "pycocotools==2.0.7",
  "openmim==0.3.9",
  "opencv-python-headless==4.8.1.78",
]
